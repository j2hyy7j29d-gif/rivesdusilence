const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
const searchEl = document.getElementById('search');
const infoEl = document.getElementById('info');

const sheetNames = Object.keys(DATA);
let activeSheet = sheetNames[0];

function linkify(text) {
  if (!text || text === 'nan') return '<span class="empty">—</span>';
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  let escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  escaped = escaped.replace(/\\n/g, '<br>');
  return escaped.replace(urlRegex, '<a href="$1" target="_blank" rel="noopener">lien ↗</a>');
}

function renderPanel(sheetName) {
  const sheet = DATA[sheetName];
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.id = 'panel-' + sheetName.replace(/\s+/g, '-');
  panel.dataset.sheet = sheetName;

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  sheet.columns.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  sheet.rows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(cell => {
      const td = document.createElement('td');
      td.innerHTML = linkify(cell);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  panel.appendChild(wrap);
  panelsEl.appendChild(panel);
}

sheetNames.forEach((name, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (i === 0 ? ' active' : '');
  btn.textContent = name + ' (' + DATA[name].rows.length + ')';
  btn.onclick = () => switchTab(name);
  tabsEl.appendChild(btn);
  renderPanel(name);
});

function switchTab(name) {
  activeSheet = name;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', sheetNames[i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => {
    p.classList.toggle('active', p.dataset.sheet === name);
  });
  filterTable();
  searchEl.focus();
}

function filterTable() {
  const q = searchEl.value.toLowerCase().trim();
  const panel = document.querySelector('.panel.active');
  if (!panel) return;
  const rows = panel.querySelectorAll('tbody tr');
  let visible = 0;
  rows.forEach(tr => {
    const txt = tr.textContent.toLowerCase();
    const match = !q || txt.includes(q);
    tr.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  infoEl.textContent = visible + ' / ' + rows.length + ' ligne(s)' + (q ? ' (filtré : "' + q + '")' : '');
}

searchEl.addEventListener('input', filterTable);
// init
document.querySelector('.panel').classList.add('active');
filterTable();
</script>
